[pytest]
# Restrict collection to the real suite.
#
# Without this a bare `pytest` walks the repository root, finds the ad-hoc
# test_*.py scripts that predate tests/, and dies collecting test_tier56.py
# because it imports groq -- which is not a dependency. The obvious command
# then fails for a reason unrelated to any actual test.
testpaths = tests
norecursedirs =
    archive dist dist_temp dist_build dist_v2 build build_tmp build_tmp2
    .devcloud node_modules nova_embedder .git __pycache__
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
