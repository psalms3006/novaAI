<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NOVA orb — visual harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #hud { position: fixed; top: 10px; left: 10px; color: #9fe; font: 12px monospace;
         background: rgba(0,0,0,0.5); padding: 8px 10px; border-radius: 6px; z-index: 10; }
  button { font: 12px monospace; margin: 2px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <div>state: <span id="cur-state">idle</span></div>
  <div id="buttons"></div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/"
  }
}
</script>
<script type="module">
  import { NovaOrb3D } from "./orb3d.js";

  const orb = new NovaOrb3D(document.getElementById("stage"));
  window.__orb = orb;
  document.getElementById("cur-state").textContent = orb.available ? "idle (webgl ok)" : "WEBGL UNAVAILABLE";
  orb.start();

  const states = ["idle", "listening", "thinking", "speaking", "hearing", "error", "interrupted", "offline"];
  const btns = document.getElementById("buttons");
  states.forEach(s => {
    const b = document.createElement("button");
    b.textContent = s;
    b.onclick = () => { orb.setState(s); document.getElementById("cur-state").textContent = s; };
    btns.appendChild(b);
  });

  // Synthetic "speech": a fake 8-band spectrum that sweeps across the bands
  // like a voice would, plus amplitude pulses, so the reactive displacement
  // is visible without a real audio source.
  let synthOn = false;
  const synthBtn = document.createElement("button");
  synthBtn.textContent = "toggle synthetic speech";
  synthBtn.onclick = () => { synthOn = !synthOn; };
  btns.appendChild(synthBtn);

  let t = 0;
  setInterval(() => {
    if (!synthOn) return;
    t += 0.12;
    const bands = new Array(8).fill(0).map((_, i) => {
      const phase = t * 2.2 + i * 0.9;
      return Math.max(0, Math.sin(phase) * 0.5 + 0.5) * (0.4 + 0.6 * Math.random());
    });
    orb.setSpectrum(bands);
    orb.setAmplitude(0.3 + 0.5 * Math.abs(Math.sin(t * 3)));
  }, 60);

  window.__report = () => ({
    available: orb.available,
    state: orb.state,
    cur: orb.cur,
    canvasSize: [orb.canvas.width, orb.canvas.height],
  });
</script>
</body>
</html>
