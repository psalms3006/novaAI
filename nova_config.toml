# nova_config.toml — Project NOVA configuration
# All tuneable values live here. Edit this file instead of changing source code.

[nova]
name        = "NOVA"
voice       = "Aoede"          # ElevenLabs / Gemini voice name
max_retries = 3                # Gemini Live reconnect attempts
history_turns = 6              # max conversation turns kept in-session

[model]
live_model   = "models/gemini-3.1-flash-live-preview"
vision_model = "gemini-flash-latest"
embed_model  = "./nova_embedder"   # local model; falls back to all-MiniLM-L6-v2
whisper_size = "tiny"              # tiny | base | small | medium

[memory]
top_k        = 5
min_score    = 0.30
max_combined_length = 2000
extract_every_n = 5            # memory extraction every N turns

[rate_limit]
min_gap_secs     = 6.0         # minimum gap between Gemini REST calls
backoff_max_secs = 1800        # max backoff on 429 (30 min)

[audio]
send_sample_rate    = 16000
receive_sample_rate = 24000
chunk_size          = 1024

[tts]
rate   = 165
volume = 0.95

[heartbeat]
interval  = 60       # seconds between ticks
min_gap   = 300      # minimum seconds between unsolicited messages
quiet_start = 22     # quiet hours start (10 PM)
quiet_end   = 7      # quiet hours end   (7 AM)

[safety]
# Tools that require explicit YES before running.
# Add tool names here to expand the confirmation list.
consequential_tools = [
  "self_editor",
  "send_message",
  "autostart",
  "game_updater",
]
# Actions within file_controller that are safe without confirmation
safe_file_actions   = ["list", "read", "find", "info"]
audit_max_lines     = 500

[server]
phone_port = 5050
ui_port    = 8080

[offline]
models   = ["tinyllama", "llama3.2", "phi3", "mistral"]
timeouts = {tinyllama = 15, llama3_2 = 30, phi3 = 30, mistral = 45}

[identity]
assistant_name = "Nova"
company = "Omniel"
aliases = []

[comms]
# Proactive calling and notification settings
enabled = true

# User contact information
phone_number = ""              # E.164 format: +15551234567
phone_verified = false
timezone = "UTC"               # User's timezone for scheduling

# Quiet hours (no proactive calls)
quiet_hours_enabled = true
quiet_start = 22               # 10 PM local time
quiet_end = 7                  # 7 AM local time

# Voice call provider settings
voice_provider = "bland"       # bland | twilio | mock
bland_voice = "june"           # Voice persona for Bland AI
max_call_duration = 10         # Maximum call duration in minutes

# Rate limiting for outbound calls
max_calls_per_hour = 3
max_calls_per_day = 10

# Retry policy for failed deliveries
retry_max_attempts = 3
retry_base_interval_seconds = 300      # 5 minutes
retry_max_interval_seconds = 3600      # 1 hour
retry_exponential_backoff = true
retry_jitter = true

# Escalation rules
# After max retries, fall back to these channels
escalation_fallback_channels = ["desktop"]  # desktop, sms, email

# Event-specific channel preferences
# morning_brief = ["voice", "desktop"]
# reminder = ["voice", "desktop"]
# critical_event = ["voice", "desktop"]

# Permissions
# Actions that require explicit user confirmation
require_confirmation_for = [
  "send_message",
  "autostart",
  "game_updater",
  "self_editor",
]
# Actions NOVA may perform without reaching user
allowed_auto_actions = [
  "web_search",
  "file_controller:read",
  "file_controller:list",
  "recall",
  "nova_memory:read",
]

# Webhook configuration
webhook_base_url = ""            # Base URL for inbound webhooks (e.g., https://yourdomain.com)

# Provider-specific settings (credentials via environment variables)
# BLAND_API_KEY - Bland AI API key
# TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN - Twilio credentials